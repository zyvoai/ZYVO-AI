<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zyvo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0d0f14; color: #e6e8ee; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid #1d2230; background: #10131a;
  }
  .brand { font-weight: 700; color: #35c46f; font-size: 18px; letter-spacing: 0.5px; }
  select, button {
    background: #1a2030; color: #e6e8ee; border: 1px solid #2a3247;
    border-radius: 8px; padding: 6px 8px; font-size: 13px; max-width: 40vw;
  }
  button { cursor: pointer; }
  button:hover { background: #232b40; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; line-height: 1.5; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #161b26; border: 1px solid #232b40; border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: #8b93a7; font-size: 12px; }
  #bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #1d2230; background: #10131a; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  #input {
    flex: 1; background: #1a2030; color: #e6e8ee; border: 1px solid #2a3247;
    border-radius: 12px; padding: 10px 12px; font-size: 15px; resize: none;
    font-family: inherit; min-height: 44px; max-height: 140px;
  }
  #send { background: #35c46f; color: #06210f; border: none; font-weight: 700; padding: 0 16px; border-radius: 12px; font-size: 15px; }
  #send:disabled { opacity: 0.5; }
  .err { color: #ff8080; }
</style>
</head>
<body>
<header>
  <span class="brand">zyvo</span>
  <select id="session" title="Session"></select>
  <button id="new" title="New chat">+ New</button>
  <span id="model" style="margin-left:auto;color:#8b93a7;font-size:12px;"></span>
</header>
<div id="log"><div class="msg sys">Loading...</div></div>
<div id="bar">
  <textarea id="input" rows="1" placeholder="Message zyvo..."></textarea>
  <button id="send">Send</button>
</div>
<script src="zyvo-ui.js"></script>
</body>
</html>
